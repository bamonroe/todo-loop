# todo-loop configuration. Every value here has a default; delete what you
# don't need to change.

[models]
# The worker, as "provider/model". Only the shell driver reads this — in-session
# the loop uses whatever model the pi session is already on, and /todo-run says
# so when the two disagree.
#
# `todo --provider <name>` and `todo --model <id>` override this for one run, so
# trying another model does not mean editing the file.
#
# "inherit" uses pi's own configured default instead.
#
# An ollama tag goes through as written — "ollama/qwen3.8-27b:52k" works. pi
# tries the whole tag as a model id first, and reads a trailing ":suffix" as a
# thinking level only when the suffix is a level name (off, low, high, ...).
# Register a local tag in ~/.pi/agent/models.json with the context ollama
# actually loads it at: pi prunes against that number, and a window it
# overstates means ollama silently drops the front of the prompt instead.
worker = "openai-codex/gpt-5.6-terra"
# The verifier. Keep it different from the worker: a model judging its own
# output is the weakest version of this check. The verify call is short, so a
# small model is fine here.
#
# Three shapes work:
#
#   opencode/<model>     hosted on OpenCode Zen
#   opencode-go/<model>  hosted on OpenCode Go
#   ollama/<model>       local, and nothing leaves the machine
#
# Hosted is usually right on a single GPU. A local verifier has to share VRAM
# with the worker, and if they do not both fit, every verification evicts the
# worker and you pay two model loads per task — run `todo doctor` to see whether
# yours fit. The cost of going hosted is that the task text, the changed file
# list and the diff are sent to the provider, and the call is metered.
#
# Hosted keys come from OPENCODE_API_KEY, or from whatever `pi` already stored
# in ~/.pi/agent/auth.json. Nothing extra to configure if `pi auth check
# --provider opencode` already says ready.
verifier = "opencode/qwen3.6-plus"

[verify]
enabled = true
# Three strikes, then the task is marked blocked and the loop halts. Without a
# cap, a slightly-too-strict verifier is an unbounded token burn.
max_attempts = 3
# Run before the verifier sees anything. A failure here short-circuits the
# model call entirely — tooling should answer the mechanical questions.
test_command = ""
build_command = ""
# Tool names whose results are carried to the verifier.
#
# The verifier reads the task, the diff and the build/test output — and nothing
# else. A worker's tool calls happen inside a session it never sees, so a task
# whose proof is a tool result rather than a build log cannot be verified at
# all: the worker ends up writing "the install succeeded" into a notes file and
# the verifier, correctly, refuses to accept a claim as evidence.
#
# Named tools get their output recorded as it happens and appended to the
# evidence, labelled as the tools' own output. Keep the list to tools that prove
# something the build cannot — an install, an instrumented run, a lint report.
# Each entry costs verifier context on every task that calls it.
#
#   evidence_tools = ["android_install", "android_instrumented", "android_lint"]
evidence_tools = []
require_tests_pass = true

# Split three ways: build output, test output, tool evidence. Logs compress
# well — the tail carries the verdict — so a third each costs little.
max_evidence_bytes = 12000

# The diff gets its own, much larger budget. It used to take a third of
# max_evidence_bytes (4000 bytes), and run 13 showed the cost: a research act
# whose whole work product was its diff got cut off, and the verifier — told to
# fail an incomplete diff — failed it twice, identically, because the retry
# reproduces the cut. Still a cap: a self-hosted verifier has a window too.
max_diff_bytes = 48000

timeout_ms = 300000

[loop]
max_iterations = 50
# require-clean: commit each verified task, and refuse to *start* one while the
# tree is dirty. commit: the same without that guard. off: ignore git entirely.
#
# Default is require-clean because the commit is `git add -A`. Anything already
# uncommitted when the loop starts is swept into a commit named after a task
# that did not do it, and the diff the verifier judges is wrong by the same
# amount. Refusing to start costs one `git stash`; the alternative costs a
# tangled history you find later.
checkpoint = "require-clean"
commit_prefix = "todo"
# A run that ends without calling todo_complete never advances the queue.
# halt: stop and wait for a human. retry: re-issue the task in a fresh session,
# still bounded by verify.max_attempts.
on_silent_stop = "halt"

[decompose]
# Smallest breakdown accepted from a scope or an epic. One child is a rename,
# not a breakdown — a scope that turns out to be a single atomic task should be
# blocked instead, and the prompt says so.
min_children = 2

[atomic]
# A leaf task whose diff touches more files than this was probably not atomic.
# Recorded as an overflow, never failed on its own: the work may be correct and
# only the size is in question.
max_files = 5

# What to do when a task overruns its budget — too many files, compaction firing
# inside a single task, or the worker using its whole clock without finishing.
#   warn    record it on the task; `todo doctor` and `todo status` show it
#   promote turn it into a scope so the next pass breaks it down
#   off     ignore
# "promote" acts only on a task that is oversized *and* has spent every attempt.
# Promoting on the first rejection was measured as worse: a scaffold rejected
# once, for a reason that had nothing to do with its size, became a plan with
# two attempts unspent — and no piece of a scaffold builds on its own, so every
# child then failed the gate its parent would have passed. One rejection is
# ordinary; three on an oversized task is the signal.
on_overflow = "warn"

# Variables every child of the loop inherits: the worker's pi session (and so
# every command the worker itself runs), the build and test commands, setup and
# teardown.
#
# This is how a project tells generic tooling where it is. A tool that has to
# hardcode a path in order to work here is a tool that only works here.
#
# Declared in the file rather than exported by a shell, because an overnight run
# started from a job runner has no shell, and a run that only works when started
# by hand from the right terminal is not reproducible.
#
# Values are literal — nothing is expanded on the way in, so "$HOME/src" arrives
# with the dollar sign intact. The commands run under `bash -lc` and can expand
# whatever they like there.
#
# TODOLOOP_DRIVER, TODOLOOP_EVIDENCE_FILE and TODOLOOP_CONFIG belong to the
# driver. Setting one here is ignored, and `todo doctor` says so.
# [env]
# PI_ANDROID_PROJECT = "/srv/myapp"

[context]
# Start eliding old tool results once context passes this fraction of the
# window. One big edit at a threshold beats trimming every turn: rewriting the
# middle of the history invalidates the KV cache from the edit point on.
prune_at_fraction = 0.6
keep_full_turns = 3
stub_min_bytes = 2000
# Cap on how much bash/grep output enters context at all. Pi's built-in 50KB
# limit is far too generous for a 27B.
tool_output_max_bytes = 2048

# Bytes of each *older* thinking block kept when the prune fires. Only matters
# when the provider actually replays reasoning — for a local ollama worker that
# means `requiresThinkingAsText` on its model entry in models.json.
#
# Dropped entirely, the worker re-derives what it already worked out, and worse,
# confabulates it: asked to repeat a number it chose a turn earlier it will state
# a different one rather than admit the gap. Replayed in full, it grows every
# turn until compaction fires and summarises thinking into more context. A fixed
# tail is neither: past keep_full_turns the retained amount stops growing.
#
# The tail, not the head, because a reasoning block states its conclusion last.
# 0 drops old thinking outright.
thinking_keep_bytes = 600

[ollama]
base_url = "http://localhost:11434/v1"
# Sampling for a *local* verifier, sent on the wire.
#
# In a pi session the verifier goes through pi's model registry, which applies
# whatever ~/.pi/agent/models.json says. `todo complete` from the command line
# has no session and no registry, so it talks to the server directly and none of
# that tuning applies. These values are that tuning, stated where the CLI path
# can see it. If you tune the model in models.json, mirror it here.
#
# The defaults are Qwen's thinking-mode recommendation. Temperature 0 looks
# right for a judge and is wrong here: it is what makes Qwen's thinking mode
# loop. `presence_penalty` is the only repetition control ollama's OpenAI
# compatibility layer forwards — top_k, min_p and repeat_penalty are dropped.
temperature = 0.6
top_p = 0.95
presence_penalty = 0.5
# Thinking budget for the verdict. Supply nothing and Qwen's chat template falls
# back to xhigh, which prepends an instruction to second-guess itself: measured
# at 38 extra prompt tokens and ~4x the completion tokens, for the same verdicts.
# "does this diff match this task" is not a question that needs deliberation.
#
# high | medium | low | none. "max" and "xhigh" make the template raise a 500 and
# are dropped rather than sent.
reasoning_effort = "low"
# Cap on the local reply — a backstop against a runaway, not a budget to aim at.
# Too low is its own failure: the model spends the whole budget thinking and
# returns an empty response, which reads as a broken verifier. Measured on
# qwen3.5:9b against a real scaffold diff, 2048 was not enough; it answered
# within 1164 when given 8192.
max_tokens = 8192
